<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/core/fonts/fonts.css">
<link rel="stylesheet" href="fonts/baloo2.css">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f2a}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
  #wall{position:absolute;inset:-40px;background:
      radial-gradient(1200px 700px at 30% 20%,#3b2a8f 0%,transparent 60%),
      radial-gradient(1000px 800px at 80% 90%,#0f4d8a 0%,transparent 60%),
      linear-gradient(160deg,#1a1450 0%,#0b1640 55%,#071026 100%)}
  #dots{position:absolute;inset:-40px;opacity:.18;background-image:radial-gradient(#9fb6ff 1.2px,transparent 1.6px);background-size:28px 28px}
  #blurwrap{position:absolute;inset:0}
  #cam{position:absolute;left:0;top:0;width:900px;height:1600px;transform-origin:0 0}
  #phone{position:absolute;left:-46px;top:-60px;width:992px;height:1720px;border-radius:118px;
      background:linear-gradient(145deg,#2c2f45,#0d0f1a 60%,#23263a);box-shadow:0 60px 140px rgba(0,0,0,.6),0 0 0 3px #3a3e58 inset}
  #screen{position:absolute;left:0;top:0;width:900px;height:1600px;border-radius:78px;overflow:hidden;background:#0d1a55}
  #screen img{position:absolute;left:0;top:0;width:900px;height:1600px;display:none}
  #fx,#spot,#wipe{position:absolute;left:0;top:0;width:1920px;height:1080px}
  #fx,#wipe{image-rendering:pixelated}
  #cap{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:max-content;max-width:1480px;white-space:normal;text-align:center;
      text-wrap:balance;line-height:1.2;padding:18px 42px;border-radius:44px;background:rgba(10,14,40,.62);backdrop-filter:blur(18px);
      border:1.5px solid rgba(255,255,255,.22);font:500 46px Fredoka;color:#fff;box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0}
  .hi #cap{font:600 46px/1.25 'Baloo 2',Fredoka;padding:16px 42px 12px}
  #endcard{position:absolute;left:0;right:0;bottom:40px;text-align:center;color:#fff;opacity:0}
  #endcard .t{display:inline-block;padding:22px 54px 24px;border-radius:40px;background:rgba(10,14,40,.64);
      backdrop-filter:blur(18px);border:1.5px solid rgba(255,255,255,.25)}
  #endcard h1{margin:0;font:400 64px 'Lilita One';letter-spacing:1px;color:#ffd65a;text-shadow:0 4px 0 rgba(0,0,0,.35)}
  #endcard p{margin:6px 0 0;font:500 34px Fredoka}
  .hi #endcard p{font:600 36px 'Baloo 2',Fredoka}
  #endcard small{display:block;margin-top:6px;font:500 26px Fredoka;color:#bcd0ff}
  /* 9:16 (?fmt=v): the same film for Reels, Shorts and stories */
  .v #cap{max-width:940px;white-space:normal;text-align:center;bottom:64px;border-radius:44px;font-size:50px;line-height:1.2}
  .v.hi #cap{font-size:50px}
  .v #endcard{bottom:70px}
  .v #endcard h1{font-size:78px}
  .v #endcard p{font-size:40px}
  .v #endcard small{font-size:30px}
</style></head>
<body>
<div id="stage">
  <div id="wall"></div><div id="dots"></div>
  <div id="blurwrap"><div id="cam"><div id="phone"></div><div id="screen"><img id="la" alt=""><img id="lb" alt=""></div></div></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <canvas id="spot" width="1920" height="1080"></canvas>
  <div id="cap"></div>
  <div id="endcard"><div class="t"><h1>TAG TEAM LUDO</h1><p id="endline"></p><small>jutebags.github.io/Tag-Team-Ludo</small></div></div>
  <canvas id="wipe" width="1920" height="1080"></canvas>
</div>
<script type="module">
// "Ludo, explained" (v2 of the Tag Team Ludo demo film). A normal viewer sees real games: what Ludo is, the pair
// rule, the bots, the review, the rewards. A voice says one thing per scene, and Tag, the pixel mascot, is the
// pointer: it stands on, points at and stomps the thing the voice is talking about.
// ?lang=en|hi picks the voice-over and captions; ?fmt=v the 9:16 cut. Scene lengths follow the voice lines'
// real lengths (out/vo/<lang>/dur.json, written by the build), so both languages keep their own pace.
import { clamp, lerp, seg, eio, eo, ei, hash } from '/core/lib.js';

const Q = new URLSearchParams(location.search);
const V = Q.get('fmt') === 'v';
const LANG = Q.get('lang') === 'hi' ? 'hi' : 'en';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
document.documentElement.classList.toggle('v', V);
document.documentElement.classList.toggle('hi', LANG === 'hi');
{
  const st = document.getElementById('stage'); st.style.width = W + 'px'; st.style.height = H + 'px';
  for (const id of ['fx', 'spot', 'wipe']) { const cv = document.getElementById(id); cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
}
const BEAT = 60 / 112;

// ---------- the voice-over and the scene clock ----------
const script = await fetch('voice/script.json').then((r) => r.json());
const real = await fetch(`out/vo/${LANG}/dur.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const LINES = Object.fromEntries(script[LANG].map((L) => [L.id, L.text]));
// Without the build's voice files (a quick local still), lengths are estimated from the text.
const VO = Object.fromEntries(Object.entries(LINES).map(([id, txt]) => [id, real?.[id] ?? txt.length * (LANG === 'hi' ? 0.085 : 0.062)]));
// How long a caption must stay up to be read (the library's readcheck: 15 letters a second plus a pad).
const NEED = (txt) => 1.6 + txt.replace(/\s/g, '').length / 15;

// The real-app clips (out/frames/<name>/f_0001.jpg…, 30 fps, extracted by the build from clips/*.mp4).
const CLIPS = await fetch('out/frames/counts.json').then((r) => (r.ok ? r.json() : null)).catch(() => null) ?? { D: 316, A: 174, B: 141, C1: 132 };
const SC = [
  { k: 'play', vo: '01', at: 0.6, min: 8.6, tail: 1.0, clip: { n: 'D', a: 0, b: 10.5 } },
  { k: 'pair', vo: '02', at: 0.3, min: 5.0, tail: 0.8, clip: { n: 'A', a: 0, b: 5.75 } },
  { k: 'move', vo: '03', at: 0.25, min: 3.7, tail: 0.6, clip: { n: 'B', a: 0.5, b: 4.65 } },
  { k: 'block', vo: '04', at: 0.25, min: 4.4, tail: 0.9, clip: { n: 'C1', a: 0, b: 4.35 } },
  { k: 'levels', vo: '05', at: 0.4, min: 6.2, tail: 0.8 },
  { k: 'review', vo: '06', at: 0.35, min: 7.4, tail: 0.9 },
  { k: 'win', vo: '07', at: 0.3, min: 4.6, tail: 0.9 },
  { k: 'end', vo: '08', at: 0.5, min: 6.6, tail: 1.6, nocap: true },
];
let T = 0;
for (const s of SC) {
  const read = s.nocap ? 0 : NEED(LINES[s.vo]);
  s.len = Math.max(s.min, s.at + VO[s.vo] + s.tail, s.at + read + 0.9);
  s.t0 = T; T += s.len;
  if (s.clip) {
    const span = s.clip.b - s.clip.a;
    s.rate = clamp(span / s.len, 0.8, 1.35);
    s.ct = (local) => Math.min(s.clip.b, s.clip.a + local * s.rate);   // scene time → clip time (holds the last frame)
    s.lt = (ct) => (ct - s.clip.a) / s.rate;                             // clip time → scene time
  }
}
window.DUR = +T.toFixed(3);
const S = Object.fromEntries(SC.map((s) => [s.k, s]));
const at = (k, local) => S[k].t0 + local;            // a scene's local time on the film's clock
const ck = (k, ct) => S[k].t0 + S[k].lt(ct);        // a clip's own time on the film's clock

// ---------- stills (real app captures, 900×1600) ----------
const SHOT = {
  home: 'shots/03-home-continue.jpg', easy: 'shots/06-level-easy.jpg', normal: 'shots/07-level-normal.jpg', hard: 'shots/08-level-hard.jpg',
  extreme: 'shots/09-level-extreme.jpg', keys: 'shots/33-review-2p-key-moves.jpg', replay: 'shots/36-replay-review-mode-ghost.jpg',
  win: 'shots/26-result-streak-unlocks-skin.jpg',
};
for (const src of Object.values(SHOT)) { const im = new Image(); im.src = src; }
// What's on the phone: [film time it has arrived, content, how it comes in]. Content = a SHOT key, or a clip scene.
const SLIDE = 0.34;
const SCREENS = [
  [at('play', 0), { clip: 'play' }, 'cut'], [at('pair', 0), { clip: 'pair' }, 'cut'], [at('move', 0), { clip: 'move' }, 'cut'], [at('block', 0), { clip: 'block' }, 'cut'],
  [at('levels', 0), 'home', 'wipe'], [at('levels', 2.0), 'easy', 'slide'], [at('levels', 2.9), 'normal', 'cut'], [at('levels', 3.75), 'hard', 'cut'], [at('levels', 4.6), 'extreme', 'cut'],
  [at('review', 0), 'keys', 'wipe'], [at('review', 3.4), 'replay', 'whip'],
  [at('win', 0), 'win', 'slide'],
  [at('end', 0), 'home', 'wipe'],
];
const WIPES = SCREENS.filter((s) => s[2] === 'wipe').map((s) => s[0]);
const WHIPS = SCREENS.filter((s) => s[2] === 'whip').map((s) => [s[0] - SLIDE, s[0]]);

// ---------- camera: per scene, [local t, zoom over the full phone, focus x, focus y] in screen pixels ----------
const CAMS = {
  play: [[0, 1.12, 450, 760], [8, 1.2, 450, 730]],
  pair: [[0, 1.2, 450, 730], [1.1, 2.7, 260, 640], [9, 2.8, 250, 640]],
  move: [[0, 2.8, 250, 640], [9, 2.8, 300, 640]],
  block: [[0, 2.8, 300, 640], [0.6, 2.5, 290, 650], [9, 2.55, 290, 650]],
  levels: [[0, 1.0, 450, 800], [1.6, 1.0, 450, 820], [2.0, 1.0, 450, 800], [2.35, 1.42, 450, 960], [9, 1.46, 450, 960]],
  review: [[0, 1.0, 450, 800], [0.5, 1.35, 480, 470], [3.2, 1.4, 470, 480], [3.4, 1.5, 420, 600], [9, 1.55, 410, 620]],
  win: [[0, 1.0, 450, 800], [0.8, 1.35, 520, 900], [9, 1.4, 520, 900]],
  end: [[0, 1.0, 450, 800], [1.0, 1.0, 450, 800], [2.0, 1.12, 450, 640], [12, 1.18, 450, 640]],
};
const CAM = SC.flatMap((s) => CAMS[s.k].filter(([t]) => t <= s.len + 0.01 || t === CAMS[s.k][CAMS[s.k].length - 1][0]).map(([t, z, x, y]) => [s.t0 + Math.min(t, s.len - 0.001), z, x, y]));
function camAt(t) {
  let i = 0;
  while (i < CAM.length - 1 && CAM[i + 1][0] <= t) i++;
  const a = CAM[i], b = CAM[Math.min(i + 1, CAM.length - 1)];
  const sameScene = SC.find((s) => a[0] >= s.t0 && a[0] < s.t0 + s.len) === SC.find((s) => b[0] >= s.t0 && b[0] < s.t0 + s.len);
  const k = b[0] > a[0] && sameScene ? eio(seg(t, a[0], b[0])) : 0;
  const z = lerp(a[1], b[1], k);
  return { z: V ? 1 + (z - 1) * 0.55 : z, fx: lerp(a[2], b[2], k), fy: lerp(a[3], b[3], k) };
}
const P = V ? 0.9 : 0.56;
const CX = V ? 540 : 960, CY = V ? 880 : 498;
function toFrame(c, x, y) { return [CX + (x - c.fx) * P * c.z, CY + (y - c.fy) * P * c.z]; }

// ---------- the mascot: "Tag", a magenta pixel pawn, the film's pointer ----------
const SPRITE = {
  stand: ['....####....', '...######...', '..########..', '..########..', '..########..', '...######...', '....####....', '...######...', '..########..', '.##########.', '.##########.', '############', '############', '.##########.'],
  crouch: ['............', '............', '....####....', '...######...', '..########..', '..########..', '..########..', '...######...', '..########..', '.##########.', '############', '############', '############', '.##########.'],
  stretch: ['....####....', '...######...', '..########..', '..########..', '..########..', '...######...', '....####....', '....####....', '...######...', '..########..', '..########..', '.##########.', '.##########.', '..########..'],
  cheer: ['#...####...#', '#..######..#', '.#########..', '..########..', '..########..', '...######...', '....####....', '...######...', '..########..', '.##########.', '.##########.', '############', '############', '.##########.'],
};
const EYES = { stand: 3, crouch: 4, stretch: 3, cheer: 3 };
const MAG = '#c43cff', MAG_D = '#7d1fb0', MAG_L = '#e7a2ff';
const PX = 7;
// Per scene: [local t0, t1, action, ...], or clip-timed with {c:[ct0, ct1]}; ms = the mascot's size in that scene.
// Coordinates are the phone screen's pixels (measured on the captures and the clips' frames).
const MS = { play: 1, pair: 0.7, move: 0.7, block: 0.7, levels: 1, review: 1, win: 1, end: 1 };
const ACTS = {
  play: [
    [0.25, 0.75, 'birth', [450, 690], [450, 352]],
    [0.75, { c: 8.35 }, 'stand', [450, 352], 'down'],
    [{ c: 8.35 }, 99, 'cheer', [450, 352]],
  ],
  pair: [
    [0.15, 0.5, 'drop', [232, 588]],
    [0.5, { c: 2.35 }, 'stand', [232, 588], 'down'],
    [{ c: 2.35 }, 99, 'stand', [232, 588], 'down', 'excl'],
  ],
  move: [
    [0, { c: 2.75 }, 'stand', [232, 588], 'down', 'excl'],
    [{ c: 2.75 }, { c: 3.35 }, 'run', [232, 588], [326, 588]],
    [{ c: 3.35 }, 99, 'cheer', [326, 588]],
  ],
  block: [
    [0, 0.3, 'stand', [326, 588], 'left'],
    [0.3, { c: 1.9 }, 'point', [330, 588]],
    [{ c: 1.9 }, 99, 'stand', [330, 588], 'left', 'excl'],
  ],
  levels: [
    [0.15, 0.5, 'drop', [600, 1042]],
    [0.5, 0.95, 'stand', [600, 1042], 'down'],
    [0.95, 1.4, 'hop', [600, 1042], [300, 1042], 90],
    [1.4, 1.75, 'stand', [300, 1042], 'down'],
    [1.75, 1.95, 'poof', [300, 1042]],
    [2.2, 2.55, 'drop', [232, 945]],
    [2.55, 2.5, 'stand', [232, 945], 'down'],
    [2.55, 2.9, 'hop', [232, 945], [377, 945], 70],
    [2.9, 3.4, 'stand', [377, 945], 'down'],
    [3.4, 3.75, 'hop', [377, 945], [522, 945], 70],
    [3.75, 4.25, 'stand', [522, 945], 'down'],
    [4.25, 4.6, 'hop', [522, 945], [667, 945], 70],
    [4.6, 99, 'cheer', [667, 945]],
  ],
  review: [
    [0.6, 0.95, 'drop', [190, 318]],
    [0.95, 1.7, 'run', [190, 318], [760, 318]],
    [1.7, 2.0, 'hop', [760, 318], [790, 463], 80],
    [2.0, 2.2, 'stand', [790, 463], 'down'],
    [2.2, 2.45, 'stomp', [790, 463]],
    [2.45, 3.2, 'stand', [790, 463], 'left', 'excl'],
    [3.6, 3.95, 'drop', [560, 598]],
    [3.95, 4.8, 'run', [560, 598], [392, 598]],
    [4.8, 99, 'point', [392, 598]],
  ],
  win: [
    [0.35, 0.7, 'drop', [640, 816]],
    [0.7, 1.1, 'stand', [640, 816], 'down'],
    [1.1, 1.5, 'hop', [640, 816], [790, 816], 70],
    [1.5, 99, 'cheer', [790, 816]],
  ],
  end: [
    [0.6, 1.1, 'drop', [450, 392]],
    [1.1, 3.6, 'cheer', [450, 392]],
    [3.6, 99, 'stand', [450, 392], 'happy'],
  ],
};
const tOf = (s, v) => (typeof v === 'object' ? s.lt(v.c) : v);
const ACT = SC.flatMap((s) => ACTS[s.k].map((a) => {
  const t0 = s.t0 + Math.min(tOf(s, a[0]), s.len), t1 = s.t0 + Math.min(tOf(s, a[1]), s.len);
  return [t0, t1, a[2], ...a.slice(3), MS[s.k]];
}).filter((a) => a[1] > a[0]));

function mascotAt(t) {
  for (const a of ACT) {
    if (t < a[0] || t >= a[1]) continue;
    const [t0, t1, type] = a, u = seg(t, t0, t1), ms = a[a.length - 1];
    const bob = Math.sin(t * Math.PI * 2 / BEAT) > 0.6 ? 'crouch' : null;
    const m = (() => {
      switch (type) {
        case 'stand': return { x: a[3][0], y: a[3][1], pose: t - t0 < 0.12 ? 'crouch' : 'stand', look: a[4], prop: typeof a[5] === 'string' ? a[5] : null, breathe: bob };
        case 'point': return { x: a[3][0], y: a[3][1], pose: 'stand', look: 'left', prop: t - t0 > 0.15 ? 'excl' : null, breathe: bob };
        case 'cheer': { const hop = Math.abs(Math.sin((t - t0) * Math.PI / BEAT)) * 22; return { x: a[3][0], y: a[3][1] - hop, pose: hop > 6 ? 'cheer' : 'crouch', look: 'happy', prop: 'spark' }; }
        case 'hop': {
          const [x0, y0] = a[3], [x1, y1] = a[4], h = a[5];
          if (u < 0.18) return { x: x0, y: y0, pose: 'crouch', look: 'up' };
          const v = seg(u, 0.18, 1);
          return { x: lerp(x0, x1, v), y: lerp(y0, y1, v) - h * 4 * v * (1 - v), pose: v < 0.55 ? 'stretch' : 'stand', look: x1 < x0 ? 'left' : 'right', flip: x1 < x0 };
        }
        case 'run': {
          const [x0, y0] = a[3], [x1, y1] = a[4];
          const step = Math.floor((t - t0) * 10) % 2;
          return { x: lerp(x0, x1, u), y: lerp(y0, y1, u) - (step ? 6 : 0), pose: step ? 'stretch' : 'stand', look: x1 < x0 ? 'left' : 'right', flip: x1 < x0, dust: true };
        }
        case 'drop': {
          const [x1, y1] = a[3];
          if (u < 0.82) return { x: x1, y: lerp(y1 - 520, y1, ei(u / 0.82)), pose: 'stretch', look: 'down' };
          return { x: x1, y: y1, pose: 'crouch', look: 'down', landed: true };
        }
        case 'birth': {
          const [x0, y0] = a[3], [x1, y1] = a[4];
          return { x: lerp(x0, x1, eo(u)), y: lerp(y0, y1, eo(u)) - 60 * Math.sin(u * Math.PI), pose: u < 0.7 ? 'stretch' : 'crouch', look: 'up', burst: u, scale: clamp(u * 3) };
        }
        case 'stomp': {
          const x = a[3][0], y = a[3][1];
          if (u < 0.5) return { x, y: y - 60 * eo(u / 0.5), pose: 'stretch', look: 'down' };
          return { x, y: y - 60 * (1 - ei((u - 0.5) / 0.5)), pose: u > 0.92 ? 'crouch' : 'stretch', look: 'wide' };
        }
        case 'poof': return { x: a[3][0], y: a[3][1], pose: 'crouch', look: 'happy', poof: u, scale: 1 - u };
      }
      return null;
    })();
    if (m) m.ms = ms;
    return m;
  }
  return null;
}

const fx = document.getElementById('fx').getContext('2d');
let nowT = 0;
function drawSprite(ctx, m, c) {
  const pose = m.breathe || m.pose, rows = SPRITE[pose];
  const s = Math.max(2, Math.round(PX * P * c.z * m.ms * (m.scale ?? 1)));
  const [fx0, fy0] = toFrame(c, m.x, m.y);
  const w = 12 * s, h = rows.length * s;
  const ox = Math.round(fx0 - w / 2), oy = Math.round(fy0 - h);
  for (let r = 0; r < rows.length; r++)
    for (let q = 0; q < 12; q++) {
      const ch = rows[r][m.flip ? 11 - q : q];
      if (ch !== '#') continue;
      const edge = r === 0 || rows[r - 1][m.flip ? 11 - q : q] !== '#';
      const right = q === 11 || rows[r][m.flip ? 10 - q : q + 1] !== '#';
      ctx.fillStyle = edge ? MAG_L : right ? MAG_D : MAG;
      ctx.fillRect(ox + q * s, oy + r * s, s, s);
    }
  const er = EYES[pose], look = m.look || 'neutral';
  const d = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[look] || [0, 0];
  for (const ex of [4, 7]) {
    const bx = ox + (m.flip ? 11 - ex - 1 : ex) * s, by = oy + er * s;
    ctx.fillStyle = '#fff';
    if (look === 'happy') { ctx.fillRect(bx, by + s, 2 * s, s * 0.6); continue; }
    ctx.fillRect(bx, by, 2 * s, 2 * s);
    ctx.fillStyle = '#1b1035';
    const pw = look === 'wide' ? s * 0.6 : s;
    ctx.fillRect(bx + (d[0] + 1) * s / 2 + (s - pw) / 2, by + (d[1] + 1) * s / 2 + (s - pw) / 2, pw, pw);
  }
  if (m.prop === 'excl') { ctx.fillStyle = '#ffd65a'; ctx.fillRect(ox + 5 * s, oy - 5 * s, 2 * s, 3 * s); ctx.fillRect(ox + 5 * s, oy - s * 1.5, 2 * s, s); }
  if (m.prop === 'spark') {
    const k = Math.floor(nowT * 6) % 2;
    ctx.fillStyle = '#ffd65a';
    for (const [sx, sy] of k ? [[-3, 1], [14, 3], [13, -2]] : [[-2, -2], [14, 0], [-3, 4]]) ctx.fillRect(ox + sx * s, oy + sy * s, s, s);
  }
  if (m.landed || m.dust) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(ox - s, oy + h - s, s, s); ctx.fillRect(ox + w, oy + h - s, s, s); }
  if (m.burst !== undefined) {
    for (let i = 0; i < 14; i++) {
      const ang = i / 14 * Math.PI * 2, r = m.burst * 120 * P * c.z;
      ctx.fillStyle = i % 2 ? MAG_L : '#ffd65a'; ctx.globalAlpha = 1 - m.burst;
      ctx.fillRect(Math.round(fx0 + Math.cos(ang) * r), Math.round(fy0 - 40 * P * c.z + Math.sin(ang) * r), s, s);
    }
    ctx.globalAlpha = 1;
  }
  if (m.poof !== undefined) {
    ctx.fillStyle = MAG_L; ctx.globalAlpha = 1 - m.poof;
    for (let i = 0; i < 8; i++) { const ang = i / 8 * Math.PI * 2, r = m.poof * 70 * P * c.z; ctx.fillRect(Math.round(fx0 + Math.cos(ang) * r), Math.round(fy0 - 30 + Math.sin(ang) * r), s, s); }
    ctx.globalAlpha = 1;
  }
}

// ---------- the user's touches (stills only; the clips show the app's own taps) ----------
const TOUCH = [[at('levels', 1.6), 300, 1100]];
function drawTouches(ctx, t, c) {
  for (const [tt, x, y] of TOUCH) {
    const d = t - tt;
    if (d < -0.35 || d > 0.45) continue;
    const [px, py] = toFrame(c, x, y);
    const press = d < 0 ? 1 - seg(d, -0.35, 0) * 0.25 : 0.75 + seg(d, 0, 0.45) * 0.25;
    ctx.globalAlpha = (d < 0 ? seg(d, -0.35, -0.1) : 1 - seg(d, 0.1, 0.45)) * 0.9;
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(px, py, 34 * press, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (d > 0) { ctx.globalAlpha = (1 - seg(d, 0, 0.45)) * 0.8; ctx.beginPath(); ctx.arc(px, py, 34 + 70 * eo(seg(d, 0, 0.45)), 0, Math.PI * 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
}

// ---------- spotlights: the thing the voice is about, lit; the rest dimmed ----------
const SPOT_LOCAL = {
  pair: [[{ c: 2.45 }, 99, 230, 622, 70]],
  move: [[{ c: 2.6 }, 99, 280, 624, 110]],
  block: [[{ c: 1.7 }, 99, 284, 628, 125]],
  levels: [[4.65, 99, 667, 985, 110]],
  review: [[2.45, 3.25, 640, 495, 330], [4.85, 99, 400, 640, 260]],
  win: [[1.6, 99, 420, 1045, 280]],
};
const SPOTS = SC.flatMap((s) => (SPOT_LOCAL[s.k] || []).map(([a, b, x, y, r]) => [s.t0 + Math.min(tOf(s, a), s.len), s.t0 + Math.min(tOf(s, b), s.len), x, y, r]));
const spot = document.getElementById('spot').getContext('2d');
function drawSpot(t, c) {
  spot.clearRect(0, 0, W, H);
  for (const [a, b, x, y, r] of SPOTS) {
    const k = Math.min(seg(t, a, a + 0.3), 1 - seg(t, b - 0.25, b));
    if (k <= 0) continue;
    const [px, py] = toFrame(c, x, y), rr = r * P * c.z;
    const g = spot.createRadialGradient(px, py, rr * 0.7, px, py, rr * 2.4);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(3,5,20,${0.6 * k})`);
    spot.fillStyle = g; spot.fillRect(0, 0, W, H);
    // a gold ring: "this one"
    spot.strokeStyle = `rgba(255,214,90,${0.95 * k})`; spot.lineWidth = Math.max(4, 6 * P * c.z * 0.6);
    spot.setLineDash([14, 10]); spot.lineDashOffset = -nowT * 40;
    spot.beginPath(); spot.arc(px, py, rr * (1.02 + 0.03 * Math.sin(nowT * 6)), 0, Math.PI * 2); spot.stroke(); spot.setLineDash([]);
  }
}

// ---------- the pixel wipe between parts ----------
const wipe = document.getElementById('wipe').getContext('2d');
function drawWipe(t) {
  wipe.clearRect(0, 0, W, H);
  for (const tw of WIPES) {
    const d = t - tw;
    if (d < -0.38 || d > 0.42) continue;
    const Sz = 60, cols = W / Sz + 1, rows = Math.ceil(H / Sz) + 1;
    for (let r = 0; r < rows; r++)
      for (let q = 0; q < cols; q++) {
        const order = (q + r * 0.6) / (cols + rows * 0.6) + hash(q * 31 + r * 7) * 0.12;
        const cover = d < 0 ? seg(d, -0.38 + order * 0.3, -0.08 + order * 0.3) : 1 - seg(d, order * 0.3, 0.12 + order * 0.3);
        if (cover <= 0) continue;
        const sz = Math.round(Sz * cover);
        wipe.fillStyle = (q + r) % 3 ? MAG : MAG_D;
        wipe.fillRect(q * Sz + (Sz - sz) / 2, r * Sz + (Sz - sz) / 2, sz, sz);
      }
  }
}

// ---------- captions: exactly what the voice says ----------
const CAPS = SC.filter((s) => !s.nocap).map((s, i, arr) => {
  const a = s.t0 + s.at - 0.1, txt = LINES[s.vo];
  const next = arr[i + 1] ? arr[i + 1].t0 + arr[i + 1].at - 0.1 : s.t0 + s.len;
  return [a, Math.min(next - 0.15, Math.max(a + VO[s.vo] + 0.65, a + NEED(txt) + 0.45)), txt];
});
const END0 = at('end', 0.4);
document.getElementById('endline').textContent = LANG === 'hi' ? 'एंड्रॉयड और वेब पर, बिल्कुल फ़्री' : 'Free on Android & the web';
const capEl = document.getElementById('cap'), endEl = document.getElementById('endcard');

// ---------- the screen layers ----------
const la = document.getElementById('la'), lb = document.getElementById('lb');
const clipFrame = (k, t) => {
  const s = S[k], n = s.clip.n, ct = s.ct(Math.max(0, t - s.t0));
  return `out/frames/${n}/f_${String(clamp(1 + Math.floor(ct * 30), 1, CLIPS[n])).padStart(4, '0')}.jpg`;
};
const srcOf = (content, t) => (typeof content === 'string' ? SHOT[content] : clipFrame(content.clip, t));
function layersAt(t) {
  let i = 0;
  while (i < SCREENS.length - 1 && SCREENS[i + 1][0] - (['slide', 'whip'].includes(SCREENS[i + 1][2]) ? SLIDE : 0) <= t) i++;
  const cur = SCREENS[i], next = SCREENS[i + 1];
  if (next && ['slide', 'whip'].includes(next[2]) && t >= next[0] - SLIDE && t < next[0]) {
    const u = eio(seg(t, next[0] - SLIDE, next[0]));
    return [[srcOf(cur[1], t), -u * 0.3 * 900, 1 - u * 0.25], [srcOf(next[1], t), (1 - u) * 900, 1]];
  }
  return [[srcOf(cur[1], t), 0, 1]];
}
async function show(el, layer) {
  if (!layer) { el.style.display = 'none'; return; }
  const [src, x, b] = layer;
  if (el.dataset.src !== src) { el.src = src; el.dataset.src = src; await el.decode().catch(() => {}); }
  el.style.display = 'block';
  el.style.transform = `translateX(${x}px)`;
  el.style.filter = b < 1 ? `brightness(${b})` : 'none';
}

const camEl = document.getElementById('cam'), blurEl = document.getElementById('blurwrap');
const wallEl = document.getElementById('wall'), dotsEl = document.getElementById('dots');

window.render = async (t) => {
  nowT = t;
  const c = camAt(t), s = P * c.z;
  camEl.style.transform = `translate(${CX - c.fx * s}px, ${CY - c.fy * s}px) scale(${s})`;
  wallEl.style.transform = `translate(${-(c.fx - 450) * 0.03}px, ${-(c.fy - 800) * 0.03}px) scale(${1 + (c.z - 1) * 0.05})`;
  dotsEl.style.transform = `translate(${-(c.fx - 450) * 0.06}px, ${-(c.fy - 800) * 0.06}px)`;
  let blur = 0;
  for (const [a, b] of WHIPS) if (t >= a && t <= b) blur = Math.sin(seg(t, a, b) * Math.PI) * 14;
  blurEl.style.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : 'none';
  const L = layersAt(t);
  await Promise.all([show(la, L[0]), show(lb, L[1])]);
  fx.clearRect(0, 0, W, H);
  const m = mascotAt(t);
  if (m) drawSprite(fx, m, c);
  drawTouches(fx, t, c);
  drawSpot(t, c);
  drawWipe(t);
  const cap = CAPS.find(([a, b]) => t >= a && t < b);
  if (cap) {
    if (capEl.dataset.k !== cap[2]) { capEl.textContent = cap[2]; capEl.dataset.k = cap[2]; }
    const k = Math.min(seg(t, cap[0], cap[0] + 0.22), 1 - seg(t, cap[1] - 0.22, cap[1]));
    capEl.style.opacity = k;
    capEl.style.transform = `translateX(-50%) translateY(${(1 - eo(k)) * 24}px) scale(${0.96 + 0.04 * k})`;
  } else capEl.style.opacity = 0;
  const ek = Math.min(seg(t, END0, END0 + 0.35), 1);
  endEl.style.opacity = ek;
  endEl.style.transform = `translateY(${(1 - eo(ek)) * 30}px)`;
};

window.TEXTS = (t) => {
  const out = [];
  const cap = CAPS.find(([a, b]) => t >= a + 0.22 && t < b - 0.22);
  if (cap) out.push({ id: 'cap' + CAPS.indexOf(cap), text: cap[2], ...(V ? { x0: 70, y0: 1660, x1: 1010, y1: 1856 } : { x0: 160, y0: 950, x1: 1760, y1: 1040 }) });
  if (t >= END0 + 0.35) out.push({ id: 'end', text: 'TAG TEAM LUDO ' + document.getElementById('endline').textContent + ' jutebags.github.io/Tag-Team-Ludo', ...(V ? { x0: 120, y0: 1560, x1: 960, y1: 1850 } : { x0: 560, y0: 820, x1: 1360, y1: 1040 }) });
  return out;
};

// ---------- sound and voice cues (read by score.py) ----------
const EV = [];
for (const s of SC) EV.push({ t: s.t0 + s.at, type: 'vo', id: s.vo });
for (const a of ACT) {
  const [t0, t1, type] = a;
  if (type === 'birth') EV.push({ t: t0, type: 'birth' }, { t: t1, type: 'land' });
  if (type === 'hop') EV.push({ t: t0 + (t1 - t0) * 0.18, type: 'jump' }, { t: t1, type: 'land' });
  if (type === 'drop') EV.push({ t: t0 + (t1 - t0) * 0.82, type: 'land' });
  if (type === 'run') for (let tt = t0; tt < t1; tt += 0.1) EV.push({ t: tt, type: 'step' });
  if (type === 'stomp') EV.push({ t: t1, type: 'stomp' });
  if (type === 'poof') EV.push({ t: t0, type: 'poof' });
  if (type === 'cheer') EV.push({ t: t0, type: 'coin' });
}
for (const [tt] of TOUCH) EV.push({ t: tt, type: 'touch' });
for (const sc of SCREENS) {
  if (sc[2] === 'slide') EV.push({ t: sc[0] - SLIDE, type: 'swish' });
  if (sc[2] === 'whip') EV.push({ t: sc[0] - SLIDE, type: 'whoosh' });
  if (sc[2] === 'wipe' && sc[0] > 0) EV.push({ t: sc[0] - 0.3, type: 'sweep' });
  if (sc[2] === 'cut' && typeof sc[1] === 'string') EV.push({ t: sc[0], type: 'tick' });
}
for (const [a] of SPOTS) EV.push({ t: a, type: 'ding' });
// the clips' own moments, in each clip's time: dice rolls, taps on a move, the capture
const CLIP_EV = { play: [[1.05, 'dice'], [2.0, 'six'], [3.05, 'dice'], [4.6, 'tap'], [6.4, 'tap'], [8.45, 'kill']], pair: [[0.45, 'dice'], [1.95, 'tap'], [2.35, 'click']], move: [[1.0, 'dice'], [2.65, 'tap']], block: [[0.9, 'dice'], [1.95, 'nope']] };
for (const [k, list] of Object.entries(CLIP_EV)) for (const [ct, type] of list) { const s = S[k]; if (ct >= s.clip.a && ct <= s.clip.b && s.lt(ct) < s.len) EV.push({ t: ck(k, ct), type }); }
EV.push({ t: at('end', 1.1), type: 'final' });
for (const [a, b, text] of CAPS) EV.push({ t: a, t1: b, type: 'cap', text });
EV.sort((a, b) => a.t - b.t);
window.EV = EV;

// ---------- ready once fonts, the stills and the first frame are in ----------
const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); document.getElementById('stage').style.transform = `scale(${k})`; };
addEventListener('resize', fit); fit();
await document.fonts.load(`600 46px 'Baloo 2'`, 'लूडो').catch(() => {});
await document.fonts.ready;
await window.render(0);
window.READY = true;
</script>
</body></html>
