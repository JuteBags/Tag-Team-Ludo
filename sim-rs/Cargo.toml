[package]
name = "ludo-sim"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Tag Team Ludo engine (src/engine) for fast self-play; traces must match tools/ai/trace.ts exactly"
publish = false

[dependencies]
rayon = "1.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12060"] }

[features]
# the GPU leaf evaluator (gpu.rs): cargo build --release --features cuda
cuda = ["dep:cudarc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[[bin]]
name = "gpu-check"
required-features = ["cuda"]
