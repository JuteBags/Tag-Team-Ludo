[package]
name = "ludo-sim"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Tag Team Ludo engine (src/engine) for fast self-play; traces must match tools/ai/trace.ts exactly"
publish = false

[dependencies]
rayon = "1.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading"] }

[features]
# the GPU leaf evaluator (gpu.rs), by the CUDA version of the NVRTC library present:
#   cargo build --release --features cuda12   (libnvrtc 12.x, e.g. the nvidia-cuda-nvrtc-cu12 wheel)
#   cargo build --release --features cuda13   (libnvrtc 13.x, e.g. torch cu130)
cuda = ["dep:cudarc"]
cuda12 = ["cuda", "cudarc/cuda-12060"]
cuda13 = ["cuda", "cudarc/cuda-13000"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[[bin]]
name = "gpu-check"
required-features = ["cuda"]

[[bin]]
name = "gpu-playout-check"
required-features = ["cuda"]
