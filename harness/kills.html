<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Kill finishers (local harness, #147)</title>
  </head>
  <body style="margin: 0; background: radial-gradient(#2a5fd0, #0b1f5c); min-height: 100vh; display: grid; place-items: center; overflow: hidden">
    <div id="stage"></div>
    <script type="module">
      // Local-only harness for recording the kill finishers: not part of the app.
      import './src/ui/styles.css';
      import { BoardView } from './src/ui/boardView';
      import { createGame, move, trayMoves, squareOf, isSafe } from './src/engine';

      const SEATS = ['blue', 'green', 'red', 'yellow'].map((color, owner) => ({ color, owner, bot: owner > 0 }));
      /** A real capture for `attacker`: a single kill, or a pair taking a pair; on a normal square, mid-board. */
      function scene(attacker, double) {
        const victim = { red: 'blue', blue: 'yellow', yellow: 'green', green: 'red' }[attacker];
        const base = createGame(SEATS, attacker);
        for (const d of double ? [4, 2] : [3, 4, 5, 2]) {
          for (let p = 14; p < 44; p++) {
            for (let q = 1; q < 50; q++) {
              const tok = (t) => (double ? [t, t, -1, -1] : [t, -1, -1, -1]);
              const players = base.players.map((pl) => ({ ...pl, tokens: pl.color === attacker ? tok(p) : pl.color === victim ? tok(q) : [-1, -1, -1, -1] }));
              const sq = squareOf(victim, q);
              if (sq === null || isSafe(sq)) continue;
              const moves = trayMoves(players, attacker, [d]);
              const m = moves.find((x) => x.captures.length === (double ? 2 : 1) && (double ? x.tokens.length === 2 : true));
              if (!m) continue;
              const state = { ...base, players, current: players.findIndex((x) => x.color === attacker), phase: 'move', dice: d, rolls: [d], moves };
              return { players, m, after: move(state, m).players };
            }
          }
        }
        throw new Error('no scene');
      }

      let view = null;
      let current = null;
      window.__setup = async (attacker, double, size) => {
        current = scene(attacker, double);
        const stage = document.getElementById('stage');
        stage.replaceChildren();
        view = new BoardView(current.players, size, [], false, true);
        stage.appendChild(view.el);
        await document.fonts.ready;
        return { kind: current.m.kind, captures: current.m.captures.length, from: current.m.from, to: current.m.to };
      };
      window.__play = async (ms = 1400) => {
        const t = performance.now();
        await view.animateMove(current.m, current.after, 1, () => {}, ms);
        return Math.round(performance.now() - t);
      };
    </script>
  </body>
</html>
