# Plays all-bot games on every pull request, on main and on the PR, and comments with the difference.
#
# Each simulation is its own file in tests/sim/ (single-house.sim.ts, double-house.sim.ts, ...), and each
# file runs as its own job, in parallel. Every job runs main and the PR side by side with this PR's
# simulation files and the same seeds, so a PR that doesn't change the game shows "No change", and every
# difference is a real effect of the PR. A job fails if a game never ends or the dice stop behaving as
# src/engine/dice.ts says. The report job joins every file's section into one PR comment, updated on each
# push; the same report goes in the run summary and the logs are run artifacts.
#
# Actions -> Simulation -> Run workflow runs every simulation file on a branch (also in parallel), with
# any number of games.

name: Simulation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      games:
        description: 'Games per setup (each setup is played with the game dice and with fair dice)'
        required: true
        default: '3000'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  files:
    name: List the simulations
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "list=$(ls tests/sim/*.sim.ts | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  compare:
    name: Simulate ${{ matrix.file }}
    needs: files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.files.outputs.list) }}
    env:
      # 3000 per setup; each file is one job, so files run side by side.
      SIM_GAMES: 3000
    steps:
      - uses: actions/checkout@v7
        with:
          path: head
      - uses: actions/checkout@v7
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: head/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: head
      - run: npm ci --no-audit --no-fund
        working-directory: base
      - name: Measure main with this PR's simulations
        run: rm -rf base/tests/sim && cp -r head/tests/sim base/tests/sim && cp head/vitest.sim.config.ts base/
      - name: Simulate main and this PR side by side
        env:
          FILE: ${{ matrix.file }}
        run: |
          (cd base && npx vitest run --config vitest.sim.config.ts "$FILE" > ../base.log 2>&1) & b=$!
          (cd head && npx vitest run --config vitest.sim.config.ts "$FILE" > ../head.log 2>&1) & h=$!
          bs=0; hs=0; wait $b || bs=$?; wait $h || hs=$?
          grep -v '^SIM_JSON ' head.log | tail -45
          [ $bs -eq 0 ] || echo "::warning::$FILE could not run on main (it may need engine changes from this PR)"
          if [ $hs -ne 0 ]; then echo "::error::$FILE failed on this PR (a game never ended, or the dice changed behaviour)"; exit 1; fi
      - name: Name this simulation
        id: name
        env:
          FILE: ${{ matrix.file }}
        run: echo "name=$(basename "$FILE" .sim.ts)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-${{ steps.name.outputs.name }}
          path: '*.log'
          retention-days: 14

  report:
    name: Comment with the results
    needs: compare
    if: always() && github.event_name == 'pull_request' && needs.compare.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: sim-*
          path: sims
      - name: Build the report
        run: |
          {
            echo '<!-- sim-compare -->'
            echo '## 🎲 Simulation: `main` → this PR'
            echo
            echo 'Every simulation file ran as its own job, in parallel, with the same seeds on both sides. "Player" rows are one seat (Blue, the seat a human plays).'
            echo
            for dir in sims/sim-*; do
              if [ -f "$dir/head.log" ] && grep -q '^SIM_JSON ' "$dir/head.log"; then
                node tools/sim-compare.mjs "$dir/base.log" "$dir/head.log"
              else
                echo "### ${dir#sims/sim-}"; echo; echo '❌ This simulation failed on this PR; see the job log.'; echo
              fi
            done
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the PR
        # Pull requests from forks get a read-only token; their report is in the run summary.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- sim-compare -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md
          fi

  run:
    name: Simulate ${{ matrix.file }}
    needs: files
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.files.outputs.list) }}
    env:
      SIM_GAMES: ${{ inputs.games }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Simulate
        env:
          FILE: ${{ matrix.file }}
        run: |
          npx vitest run --config vitest.sim.config.ts "$FILE" > sim.log 2>&1 || { tail -60 sim.log; exit 1; }
          { echo '```'; grep -v '^SIM_JSON ' sim.log | tail -45; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Name this simulation
        id: name
        env:
          FILE: ${{ matrix.file }}
        run: echo "name=$(basename "$FILE" .sim.ts)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: sim-${{ steps.name.outputs.name }}
          path: sim.log
          retention-days: 30
