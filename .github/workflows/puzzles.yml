# The daily puzzle's curated pool (#99): bot self-play, every decision screened by the net and the survivors
# reviewed at 1,024 playouts per candidate; positions with one clear Best (tools/ai/puzzles.ts). Too heavy for
# a laptop. By hand, or by pushing a puzzles/* branch (a workflow that isn't on main yet can't be started by
# hand). Shards split the games; the merge step joins them into the app's compact pool (puzzles_merge.ts),
# with the counts per band and the size, as the `puzzle-pool` artifact.
name: Puzzle pool

on:
  push:
    branches: ['puzzles/**']
  workflow_dispatch:
    inputs:
      games:
        description: 'Games per shard'
        required: true
        default: '60'
      shards:
        description: 'Shards (1-8)'
        required: true
        default: '4'
      from:
        description: 'The first game seed'
        required: true
        default: '1'
      only:
        description: 'A subset of games (normal-4p), or empty for all'
        required: false
        default: ''

permissions:
  contents: read

# A push runs these (by hand, the inputs); FROM is the first game's seed, ONLY a subset of games (--only).
env:
  GAMES: '15'
  SHARDS: '4'
  FROM: '241'
  ONLY: 'normal-4p'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: echo "shards=$(seq 0 $(( ${{ inputs.shards || env.SHARDS }} - 1 )) | jq -sc .)" >> "$GITHUB_OUTPUT"
  pool:
    needs: plan
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: bash tools/ai/build.sh
      # Shard k plays games from 1 + k * games: every shard's seeds are its own, and fixed.
      - run: |
          G=${{ inputs.games || env.GAMES }}
          ONLY=${{ inputs.only || env.ONLY }}
          node tools/ai/dist/puzzles.mjs --games $G --from $(( ${{ inputs.from || env.FROM }} + ${{ matrix.shard }} * G )) ${ONLY:+--only $ONLY} --out puzzles-${{ matrix.shard }}.json | tee puzzles-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: puzzles-${{ matrix.shard }}
          path: puzzles-${{ matrix.shard }}.*
  merge:
    needs: pool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: bash tools/ai/build.sh
      - uses: actions/download-artifact@v7
        with:
          pattern: puzzles-*
          merge-multiple: true
      - run: node tools/ai/dist/puzzles_merge.mjs puzzles-*.json --out puzzle-pool.json
      - uses: actions/upload-artifact@v7
        with:
          name: puzzle-pool
          path: puzzle-pool.json
