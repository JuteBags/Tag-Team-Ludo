# The app's screens measured the same way every time (#98): tools/perf/screens.mjs on a production build in
# headless Chrome (390x844, CPU throttled), per screen: memory, idle frames and paints, main-thread time; and
# the cold start and chunk sizes. Tables in the run summary, perf-screens.json as an artifact. By hand only
# (every perf: PR runs it before and after); a PR labelled `performance` that touches the UI also runs it.
name: Perf screens

on:
  workflow_dispatch:
    inputs:
      throttle:
        description: 'CPU throttle (x)'
        required: true
        default: '4'
  pull_request:
    types: [opened, synchronize, labeled]
    paths:
      - 'src/ui/**'
      - 'tools/perf/**'
      - '.github/workflows/perf-screens.yml'

permissions:
  contents: read

jobs:
  screens:
    name: perf screens
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'performance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.63.0
      - name: Serve the build
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
      - run: echo "commit ${{ github.sha }}, $(nproc) vCPUs, $(google-chrome --version 2>/dev/null)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The continued games, with their record (tools/perf/savedgame.ts).
      - run: |
          npx rolldown tools/perf/savedgame.ts --platform node --format esm --file tools/perf/dist/savedgame.mjs --log-level silent
          node tools/perf/dist/savedgame.mjs > saved-games.json
      - run: node tools/perf/screens.mjs http://localhost:4173/ "$(command -v google-chrome || command -v chromium)" --throttle ${{ inputs.throttle || '4' }} --saved saved-games.json
      - uses: actions/upload-artifact@v7
        with:
          name: perf-screens
          path: perf-screens.json

  # The review screen (#98 target 3): tools/perf/review.mjs and review-frames.mjs on main's build and on this
  # one, on the same runner: the before and after, and every redraw's DOM and screenshots compared.
  review:
    name: perf review screen
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'performance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build this branch and main
        run: |
          npm ci --no-audit --no-fund && npm run build
          (cd base && npm ci --no-audit --no-fund && npm run build)
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.63.0
      - name: Serve both builds
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          (cd base && npx vite preview --port 4174 --strictPort > ../preview-base.log 2>&1 &)
          for p in 4173 4174; do for i in $(seq 60); do curl -sf http://localhost:$p/ > /dev/null && break; sleep 1; done; done
      - run: echo "commit ${{ github.sha }} against main $(git -C base rev-parse --short HEAD), $(nproc) vCPUs, $(google-chrome --version 2>/dev/null)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Measure (main, then this branch)
        run: |
          chrome="$(command -v google-chrome || command -v chromium)"
          node tools/perf/review.mjs http://localhost:4174/ "$chrome" --throttle ${{ inputs.throttle || '4' }} --label main --out perf-review-main.json
          node tools/perf/review.mjs http://localhost:4173/ "$chrome" --throttle ${{ inputs.throttle || '4' }} --label "this branch" --out perf-review.json
      - name: Frames (main, then this branch), compared
        run: |
          chrome="$(command -v google-chrome || command -v chromium)"
          node tools/perf/review-frames.mjs http://localhost:4174/ frames/main "$chrome"
          node tools/perf/review-frames.mjs http://localhost:4173/ frames/branch "$chrome"
          node tools/perf/review-frames.mjs --compare frames/main frames/branch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-review
          path: |
            perf-review*.json
            frames/
