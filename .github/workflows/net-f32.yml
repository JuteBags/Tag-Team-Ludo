# The shipped Float32 net (src/engine/ai/extreme-net.bin) against the Float64 training net (extreme-net.json)
# (#98). The app ships Float32 because this measured no change in any game, review label or Extreme choice. It
# runs on every PR that changes the net, so a retrained net is checked at both precisions the same way:
#   sizes     the .bin is the JSON encoded, byte for byte; both sizes, raw and gzip;
#   strength  Extreme vs Hard in all 10 modes, fair dice, the same seeds with each net (levels_check.py
#             --compare-net): fails if any mode's win rate differs by more than noise;
#   review    the REVIEW_CALIB games reviewed from each net: labels unchanged (all and key), accuracy change
#             per game, and Extreme's own choice (tools/ai/net_f32.ts).
# Every table goes in the run summary.
name: Float32 net

on:
  pull_request:
    paths:
      - 'src/engine/ai/extreme-net.json'
      - 'src/engine/ai/extreme-net.bin'
      - 'src/engine/ai/netbin.ts'
      - 'sim-rs/src/eval.rs'
      - 'tools/ai/net_f32.ts'
      - '.github/workflows/net-f32.yml'
  push:
    branches: ['f32/**']
  workflow_dispatch:
    inputs:
      extreme_seeds:
        description: 'Seeds per mode for Extreme vs Hard, per net'
        required: true
        default: '50'
      games:
        description: 'REVIEW_CALIB games per layout and mover'
        required: true
        default: '10'

permissions:
  contents: read

jobs:
  sizes:
    name: sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: bash tools/ai/build.sh
      - run: node tools/ai/dist/net_f32.mjs make

  strength:
    name: strength
    # A push whose commit message says [review-only] skips this (slow) job.
    if: ${{ !contains(github.event.head_commit.message, '[review-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: The app's rules for the Rust engine
        run: bash tools/ai/build.sh && node tools/ai/dist/levels-json.mjs
      - name: Build the Rust engine
        run: cargo build --release --bin ludo-arena --manifest-path sim-rs/Cargo.toml
      - name: Extreme vs Hard, shipped .bin against the JSON
        run: >
          python3 tools/ai/levels_check.py --arena sim-rs/target/release/ludo-arena --only-extreme
          --extreme-seeds ${{ inputs.extreme_seeds || '50' }}
          --net src/engine/ai/extreme-net.bin --compare-net src/engine/ai/extreme-net.json

  review:
    name: review ${{ matrix.layout }} ${{ matrix.mover }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        layout: [2p, 3p, 4p, 2h-opposite]
        mover: [hard, normal]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: bash tools/ai/build.sh
      - run: node tools/ai/dist/net_f32.mjs review --layout ${{ matrix.layout }} --mover ${{ matrix.mover }} --games ${{ inputs.games || '10' }} | tee f32.txt
      - uses: actions/upload-artifact@v7
        with:
          name: f32-review-${{ matrix.layout }}-${{ matrix.mover }}
          path: f32.txt
