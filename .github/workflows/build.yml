# Builds everything, but only when started by hand, and only with release notes:
#   Actions -> Build and deploy -> Run workflow, or
#   gh workflow run build.yml --ref <branch-or-tag> -f release_notes="What changed, for players"
#   gh workflow run build.yml --ref v1.2.3 -f release_notes=release-notes/1.2.3.md   (a Markdown file)
# Pushes and pull requests don't trigger it. Empty or placeholder notes ("test", "fix") fail the run
# before anything is built. The notes go into the GitHub Release, download/version.json and the run summary.
# What it does depends on the branch or tag picked in "Use workflow from":
#
#   main                -> tests, HTML5 game, signed APK, website deployed to GitHub Pages
#                          (game at /play/, APK at /download/tag-team-ludo.apk, site from docs/).
#   a tag v1.2.3        -> tests, HTML5 game, signed APK + AAB, GitHub Release "v1.2.3".
#                          A tag with a suffix (v1.2.3-rc1) becomes a pre-release.
#   any other branch    -> tests, HTML5 game, APK as a run artifact (no deploy).
#
# APK signing uses these repository secrets (without them a debug APK is built):
#   KEYSTORE_BASE64  the .jks file, base64-encoded
#   KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
#
# versionCode is the workflow run number, so every build can update the one before it.
# Don't rename this file: a renamed workflow starts counting from 1 again.

name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (required): what changed, for players. Text, or a path like release-notes/1.2.3.md'
        required: true
        type: string

run-name: "${{ github.ref_name }}: ${{ inputs.release_notes }}"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  notes:
    name: Check the release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read and check the notes
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          notes="$NOTES"
          # A path to a Markdown file in the repo means "use that file".
          if [[ "$notes" =~ ^[A-Za-z0-9._/-]+\.md$ ]]; then
            [ -f "$notes" ] || { echo "::error::Release notes file $notes does not exist"; exit 1; }
            notes="$(cat "$notes")"
          fi
          trimmed="$(printf '%s' "$notes" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          placeholder='^(test(ing)?|wip|tmp|update[sd]?|fix(es|ed)?|changes?|misc|build|release|n/?a|none|todo|[-.]+)$'
          if [ ${#trimmed} -lt 20 ] || [[ "${trimmed,,}" =~ $placeholder ]]; then
            echo "::error::Release notes are required: at least 20 characters saying what changed for players (got '$trimmed')"
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md
          { echo "## Release notes"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 30

  web:
    name: Test and build the HTML5 game
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist
          retention-days: 14

  android:
    name: Build the Android APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(node -p "require('./package.json').version")-build.$GITHUB_RUN_NUMBER"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version $name (versionCode $GITHUB_RUN_NUMBER)"

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Load the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets available, building a debug APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          args=(-PappVersionName="$NAME" -PappVersionCode="$CODE" --no-daemon --console=plain)
          if [ "$SIGNED" = true ]; then
            # The APK is for the website and the GitHub Release; the AAB is what Google Play takes.
            ./gradlew assembleRelease bundleRelease "${args[@]}"
            cp app/build/outputs/apk/release/app-release.apk "$out/tag-team-ludo.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$out/tag-team-ludo.aab"
          else
            ./gradlew assembleDebug "${args[@]}"
            cp app/build/outputs/apk/debug/app-debug.apk "$out/tag-team-ludo.apk"
          fi

      - name: Check the APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          out="$RUNNER_TEMP/out"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$bt/aapt2" dump badging "$out/tag-team-ludo.apk" | grep -E "^package|sdkVersion|targetSdkVersion"
          unzip -l "$out/tag-team-ludo.apk" | grep -q "assets/public/index.html" || { echo "::error::The game is missing from the APK"; exit 1; }
          if [ "$SIGNED" = true ]; then
            "$bt/apksigner" verify --print-certs "$out/tag-team-ludo.apk" | grep -E "certificate (DN|SHA-256)"
            jarsigner -verify "$out/tag-team-ludo.aab" | grep -q "jar verified" || { echo "::error::The AAB is not signed"; exit 1; }
          fi
          size=$(stat -c %s "$out/tag-team-ludo.apk")
          jq -n --arg version "$NAME" --argjson code "$CODE" --argjson size "$size" --argjson signed "${SIGNED:-false}" \
            --arg commit "${GITHUB_SHA::7}" --rawfile notes "$RUNNER_TEMP/notes/release-notes.md" \
            '{version: $version, code: $code, size: $size, signed: $signed, commit: $commit, notes: $notes}' > "$out/version.json"
          cat "$out/version.json"
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.properties"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/out
          retention-days: 30

  pages:
    name: Deploy the website
    if: github.ref == 'refs/heads/main'
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: _site/play
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: _site/download
      - name: Assemble the site
        run: |
          cp -r docs/. _site/
          # The internal rules spec and the AAB stay off the public site.
          rm -f _site/RULES.md _site/download/*.aab
          find _site -maxdepth 2 | sort
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: apk
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          mv apk/tag-team-ludo.apk "apk/tag-team-ludo-$VERSION.apk"
          files=("apk/tag-team-ludo-$VERSION.apk")
          [ -f apk/tag-team-ludo.aab ] && mv apk/tag-team-ludo.aab "apk/tag-team-ludo-$VERSION.aab" && files+=("apk/tag-team-ludo-$VERSION.aab")
          # Our notes first, then GitHub's list of merged PRs.
          flags=(--title "Tag Team Ludo $VERSION" --notes-file notes/release-notes.md --generate-notes --verify-tag)
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease) || flags+=(--latest)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
