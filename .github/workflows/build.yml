# Builds on every push to main and every pull request, but deploys ONLY when started by hand.
#
#   Push to main, pull request -> tests, HTML5 game, signed APK (run artifacts). Nothing is deployed.
#   By hand (on main)          -> the same, then deploys: website + game at /play/ + APK at
#                                 /download/tag-team-ludo.apk on GitHub Pages. If the version in
#                                 package.json has no tag v<version> yet and release-notes/<version>.md
#                                 exists, it also publishes GitHub Release v<version> (signed APK + AAB),
#                                 tagging the commit it built. Otherwise it is a redeploy, no release.
#   By hand on another branch  -> build only, nothing deployed.
#
#   Actions -> Build and deploy -> Run workflow (Use workflow from: main), or
#     gh workflow run build.yml --ref main -f release_notes=release-notes/1.0.0.md
#     gh workflow run build.yml --ref main -f release_notes="..." -f commit=<sha>   (build and deploy that exact commit)
#
# Hand runs need real notes (text, or the path of a committed .md file): empty or placeholder notes
# ("test", "fix") fail the run before anything is built. A release always uses its release-notes file.
# The notes go into the GitHub Release, download/version.json and the run summary.
#
# Pull requests also get .github/workflows/sim.yml: all-bot games on main and the PR, compared in a comment.
#
# APK signing uses these repository secrets (without them a debug APK is built):
#   KEYSTORE_BASE64  the .jks file, base64-encoded
#   KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
#
# versionCode is the workflow run number, so every build can update the one before it.
# Don't rename this file: a renamed workflow starts counting from 1 again.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (required): what changed, for players. Text, or a path like release-notes/1.2.3.md'
        required: true
        type: string
      commit:
        description: 'Commit to build and deploy (full or short SHA). Empty = the latest commit of the branch.'
        required: false
        type: string
        default: ''

run-name: "${{ github.event_name == 'workflow_dispatch' && 'Deploy ' || '' }}${{ github.ref_name }}${{ inputs.commit && format(' @ {0}', inputs.commit) || '' }}: ${{ inputs.release_notes || github.event.head_commit.message || github.event.pull_request.title }}"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  # A newer push replaces an older build; a hand-started deploy is never cancelled.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  notes:
    name: Check the release notes
    runs-on: ubuntu-latest
    outputs:
      # The exact commit every job builds, whether this run deploys, and the release tag it
      # publishes ("v1.2.3", or empty).
      sha: ${{ steps.plan.outputs.sha }}
      deploy: ${{ steps.plan.outputs.deploy }}
      release: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: What this run builds and deploys
        id: plan
        run: |
          sha="$(git rev-parse HEAD)"
          deploy=false
          tag=""
          # Only a hand-started run on main deploys. It is a release when the version is new and has notes.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            deploy=true
            version="$(node -p "require('./package.json').version")"
            if [ -f "release-notes/$version.md" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              tag="v$version"
            fi
          fi
          { echo "sha=$sha"; echo "deploy=$deploy"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          echo "Commit ${sha::7}; deploy: $deploy; release: ${tag:-none}"
          { echo "Commit ${sha::7} · deploy: $deploy · release: ${tag:-none}"; echo; } >> "$GITHUB_STEP_SUMMARY"
      - name: Read and check the notes
        env:
          RELEASE: ${{ steps.plan.outputs.tag }}
          EVENT: ${{ github.event_name }}
          INPUT_NOTES: ${{ inputs.release_notes }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Hand-started runs and release tags must have real notes; everyday pushes and PRs use what they have.
          strict=false
          case "$EVENT" in
            workflow_dispatch) notes="$INPUT_NOTES"; strict=true ;;
            pull_request) notes="PR #$PR_NUMBER: $PR_TITLE" ;;
            *) notes="$COMMIT_MESSAGE" ;;
          esac
          # A release always ships its committed release notes.
          if [ -n "$RELEASE" ]; then notes="release-notes/${RELEASE#v}.md"; fi
          if [ "$strict" = true ]; then
            # A path to a Markdown file in the repo means "use that file".
            if [[ "$notes" =~ ^[A-Za-z0-9._/-]+\.md$ ]]; then
              [ -f "$notes" ] || { echo "::error::Release notes file $notes does not exist"; exit 1; }
              notes="$(cat "$notes")"
            fi
            trimmed="$(printf '%s' "$notes" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
            placeholder='^(test(ing)?|wip|tmp|update[sd]?|fix(es|ed)?|changes?|misc|build|release|n/?a|none|todo|[-.]+)$'
            if [ ${#trimmed} -lt 20 ] || [[ "${trimmed,,}" =~ $placeholder ]]; then
              echo "::error::Release notes are required: at least 20 characters saying what changed for players (got '$trimmed')"
              exit 1
            fi
          fi
          [ -n "$notes" ] || notes="Automatic build of ${GITHUB_SHA::7}"
          printf '%s\n' "$notes" > release-notes.md
          { echo "## Release notes"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 30

  web:
    name: Test and build the HTML5 game
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.notes.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist
          retention-days: 14

  android:
    name: Build the Android APK
    needs: [notes, web]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.notes.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Work out the version
        id: version
        env:
          RELEASE: ${{ needs.notes.outputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then
            name="${RELEASE#v}"
          else
            name="$(node -p "require('./package.json').version")-build.$GITHUB_RUN_NUMBER"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version $name (versionCode $GITHUB_RUN_NUMBER)"

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Load the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets available, building a debug APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          args=(-PappVersionName="$NAME" -PappVersionCode="$CODE" --no-daemon --console=plain)
          if [ "$SIGNED" = true ]; then
            # The APK is for the website and the GitHub Release; the AAB is what Google Play takes.
            ./gradlew assembleRelease bundleRelease "${args[@]}"
            cp app/build/outputs/apk/release/app-release.apk "$out/tag-team-ludo.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$out/tag-team-ludo.aab"
          else
            ./gradlew assembleDebug "${args[@]}"
            cp app/build/outputs/apk/debug/app-debug.apk "$out/tag-team-ludo.apk"
          fi

      - name: Check the APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          SHA: ${{ needs.notes.outputs.sha }}
        run: |
          out="$RUNNER_TEMP/out"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$bt/aapt2" dump badging "$out/tag-team-ludo.apk" | grep -E "^package|sdkVersion|targetSdkVersion"
          unzip -l "$out/tag-team-ludo.apk" | grep -q "assets/public/index.html" || { echo "::error::The game is missing from the APK"; exit 1; }
          if [ "$SIGNED" = true ]; then
            "$bt/apksigner" verify --print-certs "$out/tag-team-ludo.apk" | grep -E "certificate (DN|SHA-256)"
            jarsigner -verify "$out/tag-team-ludo.aab" | grep -q "jar verified" || { echo "::error::The AAB is not signed"; exit 1; }
          fi
          size=$(stat -c %s "$out/tag-team-ludo.apk")
          jq -n --arg version "$NAME" --argjson code "$CODE" --argjson size "$size" --argjson signed "${SIGNED:-false}" \
            --arg commit "${SHA::7}" --rawfile notes "$RUNNER_TEMP/notes/release-notes.md" \
            '{version: $version, code: $code, size: $size, signed: $signed, commit: $commit, notes: $notes}' > "$out/version.json"
          cat "$out/version.json"
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.properties"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/out
          retention-days: 30

  pages:
    name: Deploy the website
    if: needs.notes.outputs.deploy == 'true'
    needs: [notes, web, android]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.notes.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: _site/play
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: _site/download
      - name: Assemble the site
        run: |
          cp -r docs/. _site/
          # The internal rules spec and the AAB stay off the public site.
          rm -f _site/RULES.md _site/download/*.aab
          find _site -maxdepth 2 | sort
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: Publish the GitHub Release
    if: needs.notes.outputs.release != ''
    needs: [notes, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: apk
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version }}
          TAG: ${{ needs.notes.outputs.release }}
          SHA: ${{ needs.notes.outputs.sha }}
        run: |
          mv apk/tag-team-ludo.apk "apk/tag-team-ludo-$VERSION.apk"
          files=("apk/tag-team-ludo-$VERSION.apk")
          [ -f apk/tag-team-ludo.aab ] && mv apk/tag-team-ludo.aab "apk/tag-team-ludo-$VERSION.aab" && files+=("apk/tag-team-ludo-$VERSION.aab")
          # Our notes first, then GitHub's list of merged PRs.
          # The tag is created on the exact commit this run built.
          flags=(--title "Tag Team Ludo $VERSION" --notes-file notes/release-notes.md --generate-notes --target "$SHA")
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease) || flags+=(--latest)
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
