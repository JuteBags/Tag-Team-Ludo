# Renders the marketing demo film (marketing/demo-film) on a runner, not a laptop: every frame in headless
# Chrome, the score and foley in Python, then mux and loudness to −14 LUFS. The MP4, poster and .srt come out as
# an artifact. Run by hand, or push a film/** branch.
name: Demo film

on:
  workflow_dispatch:
  push:
    branches: ['film/**']
    paths: ['marketing/demo-film/**', '.github/workflows/demo-film.yml']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIB: ${{ github.workspace }}/lemo-opuscar
      LEMO_OPUSCAR_HOME: ${{ github.workspace }}/lemo-opuscar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      # The film tools need ffmpeg 7+ (Ubuntu 24.04 ships 6.1): a static release build.
      - name: ffmpeg 7
        run: |
          curl -fsSL -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz             || curl -fsSL -o ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir ff && tar -xf ff.tar.xz -C ff --strip-components 1
          [ -d ff/bin ] || { mkdir -p ff/bin && mv ff/ffmpeg ff/ffprobe ff/bin/; }
          ff/bin/ffmpeg -version | head -1
          echo "$PWD/ff/bin" >> "$GITHUB_PATH"
      - name: Film library and its tools
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/lemomo-ai/lemo-opuscar.git "$LIB"
          git -C "$LIB" sparse-checkout set --no-cone '/*' '!/styles/*/demo/' '!/styleboard/' '!/docs/'
          git -C "$LIB" config lemo.managed true
          sh "$LIB/plugin/skills/lemo-opuscar/scripts/setup.sh" deps
          cd "$LIB" && sudo env PATH="$PATH" node node_modules/playwright-core/cli.js install-deps chromium-headless-shell
          cd "$LIB" && sh tools/fetch.sh instruments karoryfer && sh tools/fetch.sh instruments vcsl
      - name: Render
        run: WORKERS=4 sh marketing/demo-film/build.sh
      - name: Checks
        run: |
          F=marketing/demo-film/out/tag-team-ludo-demo.mp4
          ffmpeg -hide_banner -i "$F" -af ebur128=framelog=quiet -f null - 2>&1 | grep -A3 'Integrated loudness' || true
          ffmpeg -hide_banner -i "$F" -vf blackdetect=d=0.1:pix_th=0.05 -an -f null - 2>&1 | grep blackdetect || echo "no black frames"
          cd "$LIB" && node core/render/readcheck.mjs "$GITHUB_WORKSPACE/marketing/demo-film" || true
          node core/render/still.mjs "$GITHUB_WORKSPACE/marketing/demo-film" --range 0:35:1 --out "$GITHUB_WORKSPACE/marketing/demo-film/out/contact"
      - uses: actions/upload-artifact@v5
        with:
          name: demo-film
          path: |
            marketing/demo-film/out/tag-team-ludo-demo.mp4
            marketing/demo-film/out/tag-team-ludo-demo.srt
            marketing/demo-film/out/poster.jpg
            marketing/demo-film/out/contact/
