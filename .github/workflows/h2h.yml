# The AlphaLudo head-to-head (#148): our Extreme against AlphaLudo V17 in AlphaLudo's classic one-die rules.
# Their referee (only crates/ludo_core, at a pinned commit) is checked out into the runner's temp dir, and V17 (the ONNX file
# alphaludo.in serves) is downloaded into the runner's temp dir and checked against a pinned sha256. Neither is
# committed, cached (no actions/cache), uploaded as an artifact or shipped; only our results are uploaded.
#   Dispatch only (mode=parity: the classic-mode tests, the lockstep parity check over 10k games and a V17 probe).
#   gh workflow run h2h.yml -f mode=match -f layout=4p -f a=extreme-net -f b=v17 -f deals=250 -f shards=25
#            (mode=parity|probe|match; the pilot is a match with a=extreme-net b=extreme-rules).
name: AlphaLudo head-to-head

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'parity | probe | match'
        required: true
        default: 'parity'
      layout:
        description: '2p | 4p'
        default: '2p'
      a:
        description: 'Side A (4p: the lone seat): extreme-net | extreme-rules | v17'
        default: 'extreme-net'
      b:
        description: 'Side B: extreme-net | extreme-rules | v17'
        default: 'v17'
      deals:
        description: 'Deals in all (2p: 2 games each, 4p: 4 games each)'
        default: '500'
      shards:
        description: 'Runners (each plays deals/shards deals, split over 4 processes)'
        default: '25'
      to_end:
        description: '1 = play on after the first player is home, for every place'
        default: '0'
      model_url:
        description: 'The V17 ONNX file as alphaludo.in serves it (its build path moves when they deploy)'
        default: 'https://alphaludo.in/v/94f7d0f0d0/model_v17.onnx'
      model_sha256:
        description: 'The pinned sha256 of the decompressed ONNX (empty: print it and stop; mode=probe)'
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  MODE: ${{ inputs.mode || 'parity' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: |
          n=${{ (inputs.mode == 'match' && inputs.shards) || '1' }}
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - name: Classic-mode tests (sim-rs)
        if: env.MODE != 'match'
        run: cargo test --release --manifest-path sim-rs/Cargo.toml --test classic
      - name: Their ludo_core at the pinned commit (runner temp only, that crate only)
        run: |
          A="$RUNNER_TEMP/alphaludo"; mkdir -p "$A" && cd "$A"
          git init -q && git remote add origin https://github.com/sumit7194/AlphaLudo
          git sparse-checkout set --no-cone /crates/ludo_core/
          git fetch -q --depth 1 --filter=blob:none origin 5d4e498008fb235807a1240688ddbf28b5fb7576
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          git log --oneline -1 && ls crates/ludo_core/src
          ln -s "$A" "$GITHUB_WORKSPACE/tools/ai/h2h/alphaludo"
      - name: Build the harness
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/target" cargo build --release --manifest-path tools/ai/h2h/Cargo.toml
      - name: Parity with their engine (10k games, lockstep)
        if: env.MODE == 'parity'
        run: '"$RUNNER_TEMP/target/release/h2h" parity --games 10000'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch V17 (runner temp only)
        env:
          URL: ${{ inputs.model_url || 'https://alphaludo.in/v/94f7d0f0d0/model_v17.onnx' }}
          PIN: ${{ inputs.model_sha256 }}
        run: |
          pip install --quiet onnxruntime numpy
          M="$RUNNER_TEMP/v17"; mkdir -p "$M"
          if curl -fsSL "$URL.gz" -o "$M/model.onnx.gz"; then gunzip -f "$M/model.onnx.gz"; else curl -fsSL "$URL" -o "$M/model.onnx"; fi
          SHA=$(sha256sum "$M/model.onnx" | cut -d' ' -f1)
          echo "V17 ONNX: $(stat -c %s "$M/model.onnx") bytes, sha256 $SHA, from $URL"
          echo "V17 ONNX sha256 \`$SHA\` ($URL)" >> "$GITHUB_STEP_SUMMARY"
          python tools/ai/h2h/v17.py "$M/model.onnx" --probe
          if [ "$MODE" = match ] && [ "$SHA" != "$PIN" ]; then echo "::error::V17 sha256 $SHA is not the pinned $PIN"; exit 1; fi
      - uses: actions/setup-node@v7
        if: env.MODE == 'match'
        with:
          node-version: 24
      - name: Our rules as JSON
        if: env.MODE == 'match'
        run: |
          npm ci --no-audit --no-fund
          npx rolldown tools/ai/rules_json.ts --platform node --format esm --file tools/ai/dist/rules_json.mjs --log-level silent
          mkdir -p "$RUNNER_TEMP/rules" && node tools/ai/dist/rules_json.mjs "$RUNNER_TEMP/rules"
      - name: Play (4 processes)
        if: env.MODE == 'match'
        run: |
          L=${{ inputs.layout }}; DEALS=${{ inputs.deals }}; SH=${{ inputs.shards }}; S=${{ matrix.shard }}
          ROT=$([ "$L" = 4p ] && echo 4 || echo 2)
          PER=$(( (DEALS + SH * 4 - 1) / (SH * 4) ))   # deals per process
          mkdir -p results; pids=()
          for k in 0 1 2 3; do
            FROM=$(( (S * 4 + k) * PER )); N=$(( PER ))
            [ $(( FROM + N )) -gt "$DEALS" ] && N=$(( DEALS - FROM ))
            [ "$N" -le 0 ] && continue
            "$RUNNER_TEMP/target/release/h2h" match --layout "$L" --a ${{ inputs.a }} --b ${{ inputs.b }} \
              --games $(( N * ROT )) --from "$FROM" --to-end ${{ inputs.to_end }} \
              --net src/engine/ai/extreme-net.json --playout "$RUNNER_TEMP/rules/playout-rules.json" \
              --v17 "python tools/ai/h2h/v17.py $RUNNER_TEMP/v17/model.onnx" \
              --out "results/$L-${{ inputs.a }}-${{ inputs.b }}-$FROM.jsonl" > "results/log-$k.txt" 2>&1 &
            pids+=($!)
          done
          rc=0; for p in "${pids[@]}"; do wait "$p" || rc=1; done
          tail -n 3 results/log-*.txt; exit $rc
      - uses: actions/upload-artifact@v7
        if: env.MODE == 'match'
        with:
          name: h2h-${{ matrix.shard }}
          path: results/*.jsonl

  report:
    needs: run
    if: inputs.mode == 'match'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: results
      - run: python3 tools/ai/h2h/report.py results | tee -a "$GITHUB_STEP_SUMMARY"
