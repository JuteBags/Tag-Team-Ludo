# The Rust engine's WebAssembly (#91): builds sim-wasm/ into ludo_wasm.wasm, the module the app runs for the
# Extreme bot and the game review (src/engine/ai/rollout.ts), and tests the app against that build.
#
# The module is committed (the app's build doesn't need Rust), so this job also checks that the committed
# file is exactly what its source builds to. If it isn't, the job fails and says how to update it:
#   gh run download <run id> -n ludo_wasm -D wasm-new && mv wasm-new/ludo_wasm.wasm src/engine/ai/   then commit it
# (gh run download won't overwrite a file, so it goes to a new folder first).
# Rust is pinned in sim-wasm/rust-toolchain.toml, so the same source always builds the same bytes.

name: WebAssembly engine

on:
  pull_request:
    paths:
      - 'sim-rs/**'
      - 'sim-wasm/**'
      - 'src/engine/ai/ludo_wasm.wasm'
      - 'src/engine/ai/rollout.ts'
      - 'src/engine/ai/rollout-worker.ts'
      - 'src/engine/ai/review.ts'
      - '.github/workflows/wasm.yml'
  push:
    branches: [main]
    paths:
      - 'sim-rs/**'
      - 'sim-wasm/**'
      - 'src/engine/ai/ludo_wasm.wasm'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: Build and test ludo_wasm.wasm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rust (the version in sim-wasm/rust-toolchain.toml)
        working-directory: sim-wasm
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        working-directory: sim-wasm
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Use the build in the app
        run: |
          built=sim-wasm/target/wasm32-unknown-unknown/release/ludo_wasm.wasm
          mkdir -p wasm-out && cp "$built" wasm-out/ludo_wasm.wasm
          new=$(sha256sum "$built" | cut -d' ' -f1)
          old=$(sha256sum src/engine/ai/ludo_wasm.wasm | cut -d' ' -f1)
          echo "NEW=$new" >> "$GITHUB_ENV"
          echo "OLD=$old" >> "$GITHUB_ENV"
          cp "$built" src/engine/ai/ludo_wasm.wasm
          {
            echo "## ludo_wasm.wasm"
            echo ""
            echo "- Rust: $(cd sim-wasm && rustc --version)"
            echo "- Built: $(stat -c %s "$built") bytes, sha256 \`$new\`"
            echo "- Committed: sha256 \`$old\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ludo_wasm
          path: wasm-out/ludo_wasm.wasm
      - run: npm ci --no-audit --no-fund
      - name: Test the app against the build
        run: npx vitest run tests/rollout.test.ts tests/review.test.ts
      - name: The committed module is the build
        run: |
          if [ "$NEW" != "$OLD" ]; then
            {
              echo ""
              echo "**The committed src/engine/ai/ludo_wasm.wasm is not what its source builds to.** Update it:"
              echo ""
              echo "    gh run download ${{ github.run_id }} -n ludo_wasm -D wasm-new && mv wasm-new/ludo_wasm.wasm src/engine/ai/"
              echo ""
              echo "then commit src/engine/ai/ludo_wasm.wasm."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::src/engine/ai/ludo_wasm.wasm differs from its build: gh run download ${{ github.run_id }} -n ludo_wasm -D wasm-new && mv wasm-new/ludo_wasm.wasm src/engine/ai/, then commit it"
            exit 1
          fi
          echo "The committed module matches its build." >> "$GITHUB_STEP_SUMMARY"
